name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StockWise.slnx

      - name: Build
        run: dotnet build StockWise.slnx -c Release --no-restore

      # Integration tests start a disposable PostgreSQL via Testcontainers (Docker is
      # pre-installed on GitHub-hosted ubuntu runners).
      - name: Test
        run: dotnet test tests/StockWise.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish API artifact
        run: dotnet publish src/StockWise.Api/StockWise.Api.csproj -c Release -o publish/api

      - uses: actions/upload-artifact@v4
        with:
          name: stockwise-api
          path: publish/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockwise-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stockwise-web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: stockwise-web
          path: stockwise-web/dist
